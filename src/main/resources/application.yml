spring:
  application:
    name: financial-control

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/financial_control}
    username: ${DB_USER:financial}
    password: ${DB_PASSWORD:financial}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      # Mantido em validate de proposito (RNF-04): detecta divergencia entre as
      # entidades e o schema criado pelo Flyway. Nunca trocar por update.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    # Banco novo. Ligar baseline esconderia uma migration faltando.
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}

app:
  auth:
    # Sem default: um default aqui viraria o segredo de producao no dia em que a
    # variavel faltasse. Vem do Parameter Store, como as credenciais do banco.
    jwt-secret: ${JWT_SECRET}
    jwt-validade-horas: 24
    bcrypt-forca: 12
    max-tentativas: 5
    bloqueio-minutos: 15

springdoc:
  swagger-ui:
    # A especificacao completa e um mapa da superficie de ataque. Habilitar por
    # perfil, em dev.
    enabled: false
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.rafaelmatheus.financialcontrol: INFO
  pattern:
    # O correlacao vem do MDC, posto pelo FiltroCorrelacao (D-53).
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlacao:-sem-id}] %logger{36} - %msg%n"
