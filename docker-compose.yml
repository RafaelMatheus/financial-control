services:
  postgres:
    image: postgres:16-alpine
    container_name: financial-control-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: financial_control
      POSTGRES_USER: financial
      POSTGRES_PASSWORD: financial
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial -d financial_control"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
