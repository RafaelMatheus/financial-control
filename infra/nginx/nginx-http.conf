# Variante SEM TLS, usada quando ENABLE_TLS=false — o caso de `dev`, que nao tem
# dominio e responde pelo IP elastico.
#
# A variante com TLS esta em nginx.conf. O deploy escolhe uma das duas e a grava
# como nginx/default.conf na instancia; nunca as duas ao mesmo tempo.
#
# Nao ha redirect para HTTPS aqui: sem certificado, redirecionar levaria a uma
# porta que nao atende, e foi exatamente o que quebrou o primeiro acesso.

server {
    listen 80;
    server_name _;

    # Resolver do Docker. Necessario porque o proxy_pass do front usa VARIAVEL —
    # ver o comentario em `location /`.
    resolver 127.0.0.11 valid=10s;

    # Health check em rota propria, antes do proxy geral.
    # Fica sem log para nao encher o disco com a sondagem de cada minuto.
    location /health {
        access_log off;
        proxy_pass http://app:8080/actuator/health;
        proxy_set_header Host $host;

        # Curto de proposito: health check que demora e health check que mente.
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
    }

    # A API, sob /api/. A barra final no proxy_pass REMOVE o prefixo: uma
    # requisicao a /api/gastos chega na aplicacao como /gastos.
    #
    # Isso permite que o backend continue sem saber que existe um front — nenhuma
    # rota mudou do lado dele, e nao foi preciso configurar context-path.
    location /api/ {
        proxy_pass http://app:8080/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # O front, na raiz.
    #
    # O endereco vai numa VARIAVEL de proposito: com literal, o nginx resolve o
    # nome no carregamento da configuracao e SE RECUSA A SUBIR se o container
    # `web` ainda nao existir. Com variavel, ele resolve por requisicao — entao a
    # API continua no ar mesmo antes do primeiro deploy do front, e `/` responde
    # 502 ate a imagem chegar.
    #
    # Sem isto, publicar o front e o backend na ordem errada derrubaria os dois.
    location / {
        set $front http://web:80;
        proxy_pass $front;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
