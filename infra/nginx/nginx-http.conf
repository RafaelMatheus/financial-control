# Variante SEM TLS, usada quando ENABLE_TLS=false — o caso de `dev`, que nao tem
# dominio e responde pelo IP elastico.
#
# A variante com TLS esta em nginx.conf. O deploy escolhe uma das duas e a grava
# como nginx/default.conf na instancia; nunca as duas ao mesmo tempo.
#
# Nao ha redirect para HTTPS aqui: sem certificado, redirecionar levaria a uma
# porta que nao atende, e foi exatamente o que quebrou o primeiro acesso.

server {
    listen 80;
    server_name _;

    # Health check em rota propria, antes do proxy geral.
    # Fica sem log para nao encher o disco com a sondagem de cada minuto.
    location /health {
        access_log off;
        proxy_pass http://app:8080/actuator/health;
        proxy_set_header Host $host;

        # Curto de proposito: health check que demora e health check que mente.
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
    }

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
