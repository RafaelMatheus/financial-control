# Variante COM TLS, usada quando ENABLE_TLS=true. A variante sem TLS esta em
# nginx-http.conf. O deploy escolhe uma das duas e a grava como default.conf.

# Redirect HTTP -> HTTPS, preservando o caminho de validacao do Let's Encrypt.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health check tambem em HTTP, sem redirect: sonda de disponibilidade nao
    # deve depender de TLS nem seguir 301.
    location /health {
        access_log off;
        proxy_pass http://app:8080/actuator/health;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Emitidos pelo certbot. Ver init-letsencrypt.sh para a emissao inicial.
    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location /health {
        access_log off;
        proxy_pass http://app:8080/actuator/health;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout    5s;
    }

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
