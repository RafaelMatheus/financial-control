# Composicao de producao, executada na instancia EC2.
# Deploy: docker compose -f docker-compose.prod.yml pull && up -d
#
# O PostgreSQL nao esta aqui — e RDS gerenciado, em subnet privada.

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # default.conf e gravado pelo deploy a partir de nginx.conf (com TLS) ou
      # nginx-http.conf (sem), conforme ENABLE_TLS.
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      app:
        # `service_started` faria o nginx subir antes de a aplicacao atender, e
        # os primeiros acessos morreriam em 502 ate o Spring terminar de subir.
        condition: service_healthy
      # O front NAO entra em depends_on de proposito: o nginx resolve o nome
      # `web` por requisicao, via variavel no proxy_pass, e sobe mesmo sem ele.
      # Amarrar aqui faria a API cair junto com um problema no front.

  # Front-end. Imagem publicada pelo repositorio financial-control-web, que
  # tambem faz o proprio deploy — este servico so precisa existir na composicao.
  #
  # O nginx de entrada faz proxy de `/` para ca e de `/api/` para a aplicacao.
  # Sao duas camadas de nginx: esta so serve estaticos, e a de entrada detem a
  # logica de TLS. O custo e desprezivel, e mantem a configuracao de certificado
  # num lugar so.
  #
  # `:-latest` no default: sem ele, um deploy do backend anterior ao primeiro
  # deploy do front tentaria puxar uma imagem com tag vazia e falharia.
  web:
    image: ${ECR_WEB_REPOSITORY}:${WEB_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Sem "ports": so alcancavel pela rede interna, via nginx de entrada.

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Tenta renovar a cada 12h; o certbot so age quando falta menos de 30 dias.
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

  app:
    image: ${ECR_REPOSITORY}:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      # URL vinda do Parameter Store, ja com sslmode=require (rds.force_ssl = 1)
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Sem default: a aplicacao NAO deve subir sem segredo de assinatura.
      JWT_SECRET: ${JWT_SECRET}
      SERVER_PORT: 8080
      # Default prod: se APP_PROFILE faltar, cai no perfil restritivo, nunca no
      # permissivo. Falha para o lado seguro.
      SPRING_PROFILES_ACTIVE: ${APP_PROFILE:-prod}
    # Sem "ports": so acessivel pela rede interna, via nginx.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      # 60s de carencia: Spring Boot com JPA leva alguns segundos, e sem isto as
      # tentativas iniciais contariam como falha e derrubariam o container.
      start_period: 60s

volumes:
  certbot-conf:
  certbot-www:
