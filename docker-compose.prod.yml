# Composicao de producao, executada na instancia EC2.
# O deploy roda: docker compose -f docker-compose.prod.yml pull && up -d

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # Tenta renovar a cada 12h; o certbot so age quando falta menos de 30 dias.
    entrypoint: sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"

  app:
    image: ${ECR_REPOSITORY}:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/financial_control
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    # Sem "ports": so acessivel pela rede interna, via nginx.

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: financial_control
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Volume EBS separado (RF-50). ATENCAO: nao ha backup — decisao D-36.
      - /mnt/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d financial_control"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Sem "ports": 5432 nunca exposta fora da rede do compose (RNF-16).

volumes:
  certbot-conf:
  certbot-www:
