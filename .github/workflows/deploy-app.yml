name: Deploy — Aplicação

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'Dockerfile'
      - 'docker-compose.prod.yml'
      # A configuracao do nginx e entregue pelo deploy, entao mudar nela precisa
      # disparar um. Sem isto, uma alteracao de roteamento ficaria no repositorio
      # e nunca chegaria na instancia.
      - 'infra/nginx/**'
      - 'infra/scripts/write-env.sh'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag a implantar (rollback: informe um commit SHA anterior)'
        required: false

concurrency:
  group: deploy-app
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  # Mesma precedência dos workflows de Terraform. A tag Name da instância é
  # "${project_name}-${environment}" (infra/terraform/main.tf), então o alvo do
  # SSM tem de acompanhar o ambiente — senão o deploy não encontra máquina alguma.
  TF_ENV: ${{ vars.TF_ENVIRONMENT || 'dev' }}

jobs:
  deploy:
    name: Build, push e deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Autenticar na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login no ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Tag imutável por commit SHA (RF-87): qualquer versão publicada é
      # recuperável, e o rollback é reexecutar com uma tag anterior.
      - name: Definir a tag
        id: tag
        run: echo "value=${{ inputs.image_tag || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build e push
        if: inputs.image_tag == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.ECR_REPOSITORY }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # O user-data cria apenas o .env. A composicao e a configuracao do nginx
      # vivem no repositorio e precisam chegar na instancia a cada deploy —
      # senao `docker compose -f docker-compose.prod.yml` roda num diretorio que
      # nao tem esse arquivo. Vao em base64 para atravessar o JSON do SSM sem
      # sofrer com aspas, quebras de linha e cifroes.
      - name: Empacotar a composicao e o nginx
        id: pack
        run: |
          echo "compose=$(base64 -w0 docker-compose.prod.yml)" >> "$GITHUB_OUTPUT"
          echo "nginx_tls=$(base64 -w0 infra/nginx/nginx.conf)" >> "$GITHUB_OUTPUT"
          echo "nginx_http=$(base64 -w0 infra/nginx/nginx-http.conf)" >> "$GITHUB_OUTPUT"
          echo "write_env=$(base64 -w0 infra/scripts/write-env.sh)" >> "$GITHUB_OUTPUT"

      # Deploy por SSM Run Command (RF-88): sem SSH, porta 22 fechada,
      # nenhuma chave privada no repositório.
      - name: Deploy via SSM
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=financial-control-${TF_ENV}" \
            --comment "Deploy ${{ steps.tag.outputs.value }}" \
            --parameters commands='[
              "set -euo pipefail",
              "echo ${{ steps.pack.outputs.write_env }} | base64 -d > /tmp/write-env.sh",
              "chmod +x /tmp/write-env.sh",
              "/tmp/write-env.sh ${{ env.TF_ENV }} ${{ vars.ECR_REPOSITORY }} ${{ vars.ECR_WEB_REPOSITORY }}",
              "cd /opt/financial-control-${{ env.TF_ENV }}",
              "mkdir -p nginx",
              "echo ${{ steps.pack.outputs.compose }} | base64 -d > docker-compose.prod.yml",
              "echo ${{ steps.pack.outputs.nginx_tls }} | base64 -d > nginx/nginx.conf",
              "echo ${{ steps.pack.outputs.nginx_http }} | base64 -d > nginx/nginx-http.conf",
              "sed -i \"s|^IMAGE_TAG=.*|IMAGE_TAG=${{ steps.tag.outputs.value }}|\" .env",
              "set -a; . ./.env; set +a",
              "if [ \"$ENABLE_TLS\" = \"true\" ]; then cp nginx/nginx.conf nginx/default.conf; sed -i \"s|DOMAIN|$DOMAIN_NAME|g\" nginx/default.conf; else cp nginx/nginx-http.conf nginx/default.conf; fi",
              "aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ vars.ECR_REPOSITORY }}",
              "docker compose -f docker-compose.prod.yml pull",
              "docker compose -f docker-compose.prod.yml up -d --wait",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Command: $COMMAND_ID"

      - name: Aguardar conclusão
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=financial-control-${TF_ENV}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.ssm.outputs.command_id }}" \
              --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "[$i/30] $STATUS"
            case "$STATUS" in
              Success) echo "Deploy concluído."; exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "${{ steps.ssm.outputs.command_id }}" \
                  --instance-id "$INSTANCE_ID" \
                  --query StandardErrorContent --output text
                exit 1 ;;
            esac
            sleep 10
          done
          echo "Timeout aguardando o comando."; exit 1

      # O SSM ter dado Success significa que os comandos rodaram, nao que a
      # aplicacao atende. Sem esta verificacao, um deploy que sobe um container
      # que morre em seguida e reportado como sucesso.
      - name: Verificar o health check
        run: |
          IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=financial-control-${TF_ENV}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          echo "Instancia: $IP"

          for i in $(seq 1 20); do
            CORPO=$(curl -fsS --max-time 5 "http://$IP/health" 2>/dev/null || true)
            if echo "$CORPO" | grep -q '"status":"UP"'; then
              echo "Health check OK: $CORPO"
              echo "### Deploy verificado" >> "$GITHUB_STEP_SUMMARY"
              echo "\`http://$IP/health\` respondeu \`$CORPO\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "[$i/20] ainda nao respondeu UP: ${CORPO:-sem resposta}"
            sleep 15
          done

          echo "::error::A aplicacao nao respondeu UP em 5 minutos."
          exit 1
