name: Deploy — Aplicação

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'Dockerfile'
      - 'docker-compose.prod.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag a implantar (rollback: informe um commit SHA anterior)'
        required: false

concurrency:
  group: deploy-app
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  # Mesma precedência dos workflows de Terraform. A tag Name da instância é
  # "${project_name}-${environment}" (infra/terraform/main.tf), então o alvo do
  # SSM tem de acompanhar o ambiente — senão o deploy não encontra máquina alguma.
  TF_ENV: ${{ vars.TF_ENVIRONMENT || 'dev' }}

jobs:
  deploy:
    name: Build, push e deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Autenticar na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login no ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Tag imutável por commit SHA (RF-87): qualquer versão publicada é
      # recuperável, e o rollback é reexecutar com uma tag anterior.
      - name: Definir a tag
        id: tag
        run: echo "value=${{ inputs.image_tag || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build e push
        if: inputs.image_tag == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.ECR_REPOSITORY }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy por SSM Run Command (RF-88): sem SSH, porta 22 fechada,
      # nenhuma chave privada no repositório.
      - name: Deploy via SSM
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=financial-control-${TF_ENV}" \
            --comment "Deploy ${{ steps.tag.outputs.value }}" \
            --parameters commands='[
              "set -euo pipefail",
              "cd /opt/financial-control",
              "sed -i \"s|^IMAGE_TAG=.*|IMAGE_TAG=${{ steps.tag.outputs.value }}|\" .env",
              "aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ vars.ECR_REPOSITORY }}",
              "docker compose -f docker-compose.prod.yml pull",
              "docker compose -f docker-compose.prod.yml up -d",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Command: $COMMAND_ID"

      - name: Aguardar conclusão
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=financial-control-${TF_ENV}" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.ssm.outputs.command_id }}" \
              --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "[$i/30] $STATUS"
            case "$STATUS" in
              Success) echo "Deploy concluído."; exit 0 ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "${{ steps.ssm.outputs.command_id }}" \
                  --instance-id "$INSTANCE_ID" \
                  --query StandardErrorContent --output text
                exit 1 ;;
            esac
            sleep 10
          done
          echo "Timeout aguardando o comando."; exit 1
