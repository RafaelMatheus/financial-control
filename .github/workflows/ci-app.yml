name: CI — Aplicação

# Filtro de path (RNF-14): mudança em Kotlin não dispara os workflows de infra.
on:
  pull_request:
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'Dockerfile'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'

concurrency:
  group: ci-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # O repositório não versiona gradle-wrapper.jar, então o Gradle é
      # instalado explicitamente em vez de usar ./gradlew.
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'

      # Testcontainers precisa de Docker — já disponível no runner ubuntu-latest.
      - name: Build e testes
        run: gradle build --no-daemon

      # Property-based testing: registra o seed para reprodução (regra PBT-08).
      - name: Publicar relatórios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          retention-days: 7
