name: Terraform — Apply

# Apply automático no merge, sem gate de aprovação (decisão D-25).
# Mitigado por prevent_destroy no volume EBS, Elastic IP, ECR e bucket de state,
# e pelo volume declarado separadamente da instância — ver risco R-05.
on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
  workflow_dispatch:

concurrency:
  group: terraform-apply
  cancel-in-progress: false # nunca cancelar um apply em andamento

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    name: Apply (prod)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - uses: actions/checkout@v4

      - name: Autenticar na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.5'

      - name: Init
        run: terraform init -backend-config=envs/prod/backend.hcl

      - name: Apply
        run: |
          terraform apply -auto-approve \
            -var-file=envs/prod/terraform.tfvars \
            -var="ecr_repository=${{ vars.ECR_REPOSITORY }}"

      - name: Saídas
        run: terraform output
